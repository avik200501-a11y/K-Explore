<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Events | K Explore</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../JAVASCRIPT/index.js" defer></script>
</head>
<body>

    <header class="site-header">
        <nav class="navbar container">
            <a href="./index.html" class="logo">K EXPLORE.</a>

            <button class="menu-toggle" id="menuToggle">☰</button>

            <ul class="nav-links" id="navLinks">
                <a href="./index.html">Home</a>
                <a href="./Events.html">Explore Events</a>
                <a href="./About.html">About</a>
                <a href="./help.html">Help</a>
                <a href="./my-registrations.html">My Registrations</a>
            </ul>

            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle">☾</button>
                <a href="./Login.html" class="btn btn-small">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-banner">
            <div class="container">
                <h1>Explore Events</h1>
                <p>Search, discover and find your next experience.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">

                <div id="eventListing">
                    <div class="search-row">
                        <input
                            class="search-input"
                            id="searchInput"
                            type="search"
                            placeholder="Search events..."
                        >
                    </div>

                    <div class="filters">
                        <button class="filter-btn active" data-category="All">All Events</button>
                        <button class="filter-btn" data-category="Technology">Technology</button>
                        <button class="filter-btn" data-category="Music">Music</button>
                        <button class="filter-btn" data-category="Business">Business</button>
                        <button class="filter-btn" data-category="Cultural">Cultural</button>
                    </div>

                    <div class="event-grid" id="eventContainer"></div>
                </div>

                <div id="eventDetail" hidden></div>

            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div>
                <a href="./index.html" class="logo" style="color:white">K EXPLORE.</a>
                <p>Discover. Connect. Experience.</p>
            </div>

            <div class="footer-links">
                <a href="./Events.html">Events</a>
                <a href="./About.html">About</a>
                <a href="./help.html">Help</a>
            </div>

            <p>© 2026 K Explore. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
